<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Terra Chronicle · 大地编年史</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Noto+Serif+SC:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2b2722; --ivory:#f6f1e7; --gold:#c9a24b; --gold-soft:rgba(201,162,75,.55);
    --hairline:rgba(43,39,34,.18);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0d0f12;font-family:'Noto Serif SC',serif;color:var(--ink)}
  canvas{display:block}

  /* ---------- 标题界面 ---------- */
  #title{
    position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    overflow:hidden;transition:opacity 2.2s cubic-bezier(.65,0,.35,1);
  }
  #title .bg{
    position:absolute;inset:-6%;
    background:url('../assets/concept/kv_continent.png') center/cover;
    animation:kvBreath 26s ease-in-out infinite alternate;
    filter:saturate(1.04);
  }
  @keyframes kvBreath{from{transform:scale(1) translateY(0)}to{transform:scale(1.07) translateY(-1.4%)}}
  #title .veil{position:absolute;inset:0;background:
    radial-gradient(ellipse at 50% 42%,rgba(8,10,14,0) 30%,rgba(8,10,14,.55) 100%),
    linear-gradient(rgba(8,10,14,.18),rgba(8,10,14,.34));}
  #title .card{position:relative;text-align:center;color:var(--ivory);transform:translateY(-2vh)}
  #title .epoch{
    font-family:'Cormorant Garamond',serif;letter-spacing:.55em;font-size:13px;opacity:0;
    text-transform:uppercase;animation:riseIn 1.6s .4s cubic-bezier(.2,.8,.2,1) forwards;
  }
  #title h1{
    font-weight:300;font-size:clamp(44px,7vw,92px);letter-spacing:.18em;margin:18px 0 6px;
    opacity:0;animation:riseIn 1.8s .8s cubic-bezier(.2,.8,.2,1) forwards;
    text-shadow:0 2px 40px rgba(0,0,0,.45);
  }
  #title h2{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:400;
    font-size:clamp(15px,1.6vw,21px);letter-spacing:.3em;opacity:0;
    animation:riseIn 1.8s 1.15s cubic-bezier(.2,.8,.2,1) forwards;
  }
  #title .rule{
    width:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold-soft),transparent);
    margin:34px auto;animation:ruleGrow 1.6s 1.5s cubic-bezier(.65,0,.35,1) forwards;
  }
  @keyframes ruleGrow{to{width:min(420px,46vw)}}
  @keyframes riseIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
  #enter{
    opacity:0;animation:riseIn 1.6s 1.9s cubic-bezier(.2,.8,.2,1) forwards;
    background:none;border:1px solid rgba(246,241,231,.4);color:var(--ivory);
    font-family:'Noto Serif SC',serif;font-weight:300;letter-spacing:.5em;text-indent:.5em;
    font-size:15px;padding:15px 52px;cursor:pointer;position:relative;overflow:hidden;
    transition:border-color .6s,color .6s;
  }
  #enter::before{
    content:'';position:absolute;inset:0;background:var(--ivory);transform:scaleX(0);
    transform-origin:left;transition:transform .55s cubic-bezier(.65,0,.35,1);z-index:-1;
  }
  #enter:hover{color:var(--ink);border-color:var(--ivory)}
  #enter:hover::before{transform:scaleX(1)}
  #title .hint{margin-top:26px;font-size:11px;letter-spacing:.35em;opacity:0;
    animation:riseIn 1.6s 2.3s forwards;color:rgba(246,241,231,.55)}

  /* 转场白闪与云幕 */
  #flash{position:fixed;inset:0;z-index:60;background:#fdfaf3;opacity:0;pointer-events:none}
  #clouds{position:fixed;inset:0;z-index:55;pointer-events:none;opacity:0}

  /* ---------- 世界层 ---------- */
  #world{position:fixed;inset:0;z-index:10}

  /* ---------- HUD（界面层走 DOM）---------- */
  #hud{position:fixed;inset:0;z-index:30;pointer-events:none;opacity:0;transition:opacity 1.8s 1s}
  .hud-on #hud{opacity:1}

  #seasonDial{position:absolute;top:34px;left:38px;width:108px;height:108px}
  #seasonDial svg{width:100%;height:100%;overflow:visible}
  #dialLabel{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--ivory);text-shadow:0 1px 14px rgba(0,0,0,.5);
  }
  #dialLabel .s{font-size:19px;font-weight:500;letter-spacing:.32em;text-indent:.32em}
  #dialLabel .d{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.28em;margin-top:4px;opacity:.78}

  #clock{
    position:absolute;top:46px;left:170px;color:var(--ivory);text-shadow:0 1px 12px rgba(0,0,0,.45);
  }
  #clock .num{font-family:'Cormorant Garamond',serif;font-size:34px;font-weight:400;line-height:1}
  #clock .cap{font-size:10px;letter-spacing:.42em;opacity:.7;margin-top:6px}

  #stamina{position:absolute;top:40px;right:42px;display:flex;gap:9px;align-items:center}
  #stamina .leaf{width:13px;height:13px;border-radius:60% 0 60% 0;background:var(--ivory);
    opacity:.92;box-shadow:0 1px 10px rgba(0,0,0,.35);transform:rotate(45deg);transition:opacity .5s}
  #stamina .leaf.spent{opacity:.22}

  /* 地块面板 —— 弹簧动效由 JS 驱动 transform */
  #panel{
    position:absolute;top:0;right:0;height:100%;width:min(360px,86vw);
    background:rgba(246,241,231,.92);backdrop-filter:blur(14px) saturate(1.1);
    border-left:1px solid var(--hairline);padding:54px 38px;pointer-events:auto;
    transform:translateX(110%);box-shadow:-30px 0 80px rgba(10,10,10,.18);
  }
  #panel .kicker{font-family:'Cormorant Garamond',serif;font-size:11px;letter-spacing:.5em;color:var(--gold);text-transform:uppercase}
  #panel h3{font-size:27px;font-weight:500;letter-spacing:.14em;margin:10px 0 4px}
  #panel .latin{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;opacity:.55;margin-bottom:30px}
  #panel .close{position:absolute;top:26px;right:28px;width:30px;height:30px;cursor:pointer;opacity:.55;transition:opacity .3s,transform .5s cubic-bezier(.2,.8,.2,1)}
  #panel .close:hover{opacity:1;transform:rotate(90deg)}
  #panel .close::before,#panel .close::after{content:'';position:absolute;top:14px;left:4px;width:22px;height:1px;background:var(--ink)}
  #panel .close::before{transform:rotate(45deg)}#panel .close::after{transform:rotate(-45deg)}
  .stat{margin-bottom:24px}
  .stat .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .stat .name{font-size:13px;letter-spacing:.26em}
  .stat .val{font-family:'Cormorant Garamond',serif;font-size:21px}
  .stat .bar{height:2px;background:rgba(43,39,34,.12);position:relative;overflow:hidden}
  .stat .bar i{position:absolute;inset:0;transform-origin:left;background:var(--ink);transform:scaleX(0)}
  .stat.gold .bar i{background:var(--gold)}
  #panel .foot{position:absolute;bottom:44px;left:38px;right:38px;font-size:11px;
    letter-spacing:.18em;line-height:2.1;opacity:.6;border-top:1px solid var(--hairline);padding-top:20px}

  /* 卡牌一瞥（右下角，悬停 3D 倾斜） */
  #cardPeek{
    position:absolute;right:44px;bottom:40px;width:118px;aspect-ratio:2/3;pointer-events:auto;
    perspective:700px;cursor:pointer;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45));
    transition:transform .7s cubic-bezier(.2,.8,.2,1);
  }
  #cardPeek:hover{transform:translateY(-12px) scale(1.06)}
  #cardPeek .face{
    width:100%;height:100%;border-radius:7px;background:url('../assets/concept/card_template.png') center/cover;
    transition:transform .25s ease-out;will-change:transform;
  }
  #cardPeek .tag{
    position:absolute;bottom:-26px;left:0;right:0;text-align:center;color:rgba(246,241,231,.7);
    font-size:10px;letter-spacing:.4em;text-indent:.4em;
  }

  /* 底部叙事字幕 */
  #whisper{
    position:absolute;bottom:46px;left:50%;transform:translateX(-50%);
    color:rgba(246,241,231,.82);font-weight:300;font-size:14px;letter-spacing:.34em;text-indent:.34em;
    text-shadow:0 1px 16px rgba(0,0,0,.55);opacity:0;transition:opacity 2s;white-space:nowrap;
  }

  /* 天气角标 */
  #weatherTag{
    position:absolute;left:42px;bottom:44px;color:rgba(246,241,231,.75);
    font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;letter-spacing:.2em;
    text-shadow:0 1px 12px rgba(0,0,0,.5);
  }
</style>
</head>
<body>

<canvas id="world"></canvas>

<div id="hud">
  <div id="seasonDial">
    <svg viewBox="0 0 108 108">
      <circle cx="54" cy="54" r="50" fill="rgba(10,12,14,.28)" stroke="rgba(246,241,231,.28)" stroke-width="1"/>
      <g id="dialRing"></g>
      <circle id="dialDot" cx="54" cy="4" r="2.6" fill="#f6f1e7"/>
    </svg>
    <div id="dialLabel"><div class="s" id="seasonName">春</div><div class="d" id="seasonLatin">VER</div></div>
  </div>
  <div id="clock"><div class="num"><span id="dayNum">01</span></div><div class="cap">年代 I · 第一年</div></div>
  <div id="stamina"></div>
  <div id="weatherTag">— 微风拂过山谷 —</div>

  <div id="panel">
    <div class="close" id="panelClose"></div>
    <div class="kicker">Parcel · 地籍档案</div>
    <h3 id="tileName">河畔田</h3>
    <div class="latin" id="tileLatin">Ager Fluminis</div>
    <div class="stat"><div class="row"><span class="name">肥 力</span><span class="val" id="vFert">—</span></div><div class="bar"><i id="bFert"></i></div></div>
    <div class="stat"><div class="row"><span class="name">湿 度</span><span class="val" id="vMoist">—</span></div><div class="bar"><i id="bMoist"></i></div></div>
    <div class="stat"><div class="row"><span class="name">虫害压力</span><span class="val" id="vPest">—</span></div><div class="bar"><i id="bPest"></i></div></div>
    <div class="stat gold"><div class="row"><span class="name">灵脉充能</span><span class="val" id="vMana">—</span></div><div class="bar"><i id="bMana"></i></div></div>
    <div class="foot">此地块产出的材料将继承土地质量。<br>肥力越高，锻造出的卡牌基础数值越高。</div>
  </div>

  <div id="cardPeek"><div class="face"></div><div class="tag">工坊 · 待锻</div></div>
  <div id="whisper">点击土地查看地籍 · 按 1-4 切换季节 · F 加速时光</div>
</div>

<div id="title">
  <div class="bg"></div><div class="veil"></div>
  <div class="card">
    <div class="epoch">Epoch I · The First Continent</div>
    <h1>大地编年史</h1>
    <h2>TERRA CHRONICLE</h2>
    <div class="rule"></div>
    <button id="enter">踏 上 大 陆</button>
    <div class="hint">四季在这片土地上同时流转</div>
  </div>
</div>
<canvas id="clouds"></canvas>
<div id="flash"></div>

<script>
'use strict';
/* =========================================================
   Terra Chronicle — Living Map visual prototype v0
   世界层: Canvas2D 等距山谷 · 四季连续插值 · 天气粒子 · 昼夜光
   界面层: DOM + 弹簧物理
   ========================================================= */
const W = document.getElementById('world'), ctx = W.getContext('2d');
let vw=0, vh=0, dpr=1;
function resize(){ dpr=Math.min(devicePixelRatio||1,2); vw=innerWidth; vh=innerHeight;
  W.width=vw*dpr; W.height=vh*dpr; W.style.width=vw+'px'; W.style.height=vh+'px'; }
addEventListener('resize',resize); resize();

/* ---------- 时间系统 ---------- */
const DAY_SECONDS=30, SEASON_DAYS=7;             // demo 节奏:30s 一天,7 天一季
let elapsed=0;                                    // 总秒数
const seasons=[
 {name:'春',latin:'VER'},{name:'夏',latin:'AESTAS'},
 {name:'秋',latin:'AUTUMNUS'},{name:'冬',latin:'HIEMS'}];

/* ---------- 调色脚本: 每季一组色板,连续插值 ---------- */
const PAL={
 grass:[[140,176,96],[110,158,74],[176,148,72],[214,219,224]],
 grassHi:[[178,206,122],[140,186,96],[206,176,92],[236,240,244]],
 crop:[[164,196,108],[206,182,84],[222,158,64],[176,182,190]],
 tree:[[96,140,84],[62,116,66],[188,112,52],[110,124,118]],
 treeAlt:[[214,160,186],[80,132,72],[206,140,58],[126,138,132]],   // 春=樱
 water:[[92,158,170],[70,144,162],[96,140,158],[130,158,176]],
 soil:[[126,98,72],[118,92,66],[110,86,64],[134,124,118]],
 sky1:[[168,196,210],[150,192,214],[196,170,140],[176,190,204]],
 sky2:[[226,232,222],[210,226,224],[232,206,170],[222,228,234]],
};
const lerp=(a,b,t)=>a+(b-a)*t;
function pal(key,st){ // st: 季节连续值 0..4
  const i=((Math.floor(st)%4)+4)%4, j=(i+1)%4, f=st-Math.floor(st);
  const A=PAL[key][i],B=PAL[key][j];
  return [lerp(A[0],B[0],f),lerp(A[1],B[1],f),lerp(A[2],B[2],f)];
}
const rgb=(c,a=1)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;

/* ---------- 地图数据 ---------- */
const N=15, TILE_W=78, TILE_H=39;
function hash(x,y){let h=(Math.imul(x,374761393)+Math.imul(y,668265263))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
const map=[];
const kept=new Set();
const names=['河畔田','缓丘地','灵脉壤','老橡园','黑土塬','雾谷田'];
const latins=['Ager Fluminis','Collis Lenis','Solum Animae','Quercetum','Terra Nigra','Vallis Nebulae'];
for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  const r=hash(x,y), cx=x-N/2+.5, cy=y-N/2+.5, d=Math.hypot(cx,cy);
  if(d + (hash(x*3+11,y*7+5)-.5)*2.2 > 6.9) continue;          // 不规则岛缘
  kept.add(x+','+y);
  let type='grass';
  const river=Math.abs(cy*.9 + Math.sin(cx*.7)*1.6) < .85;
  if(river) type='water';
  else if(d<4.3 && r<.6) type='field';
  else if(d>3.6 && r>.86) type='forest';
  else if(d>3.2 && r>.66) type='tree';
  if(x===4&&y===3) type='windmill';
  if(x===10&&y===10) type='home';
  map.push({x,y,type,r,
    fert:55+((r*97)%1)*42|0, moist:40+((r*53)%1)*55|0,
    pest:5+((r*29)%1)*28|0, mana:20+((r*71)%1)*70|0,
    ni:(r*names.length)|0, grow:r});
}
for(const t of map) t.edge = !(kept.has((t.x+1)+','+t.y)&&kept.has((t.x-1)+','+t.y)&&kept.has(t.x+','+(t.y+1))&&kept.has(t.x+','+(t.y-1)));
const tileAt={}; for(const t of map) tileAt[t.x+','+t.y]=t;
function isoX(x,y){return (x-y)*TILE_W/2;}
function isoY(x,y){return (x+y)*TILE_H/2;}

/* ---------- 镜头(用于入场降落转场) ---------- */
const cam={scale:1.55,target:1, y:60, ty:0};

/* ---------- 粒子: 花瓣/雨/落叶/雪 + 萤火 ---------- */
const parts=[];
function spawnParticles(st,dt){
  const s=Math.floor(st)%4, budget=s===0?2:s===1?1:s===2?2:3;
  for(let i=0;i<budget;i++){ if(parts.length>240)break;
    parts.push({x:Math.random()*vw, y:-20, s,
      vx:(s===2? -20-Math.random()*30 : (Math.random()-.5)*14),
      vy:s===3? 22+Math.random()*18 : s===1? 120 : 34+Math.random()*26,
      r:s===1? 0 : 2+Math.random()*2.6, ph:Math.random()*6.28, life:0});
  }
  // 夏夜萤火
  if(s===1 && sunlight()<0.35 && Math.random()<.3 && parts.length<260)
    parts.push({x:Math.random()*vw,y:vh*.45+Math.random()*vh*.4,s:9,vx:0,vy:0,r:1.6,ph:Math.random()*6.28,life:0});
}
function drawParticles(dt,st){
  ctx.save();
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life+=dt;p.ph+=dt*2;
    if(p.s===9){ // firefly
      p.x+=Math.sin(p.ph*.9)*18*dt; p.y+=Math.cos(p.ph*.7)*12*dt;
      const a=Math.max(0,Math.sin(p.ph))*.8;
      ctx.fillStyle=`rgba(255,232,150,${a})`;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r+Math.sin(p.ph)*0.6,0,7);ctx.fill();
      if(p.life>7)parts.splice(i,1); continue;
    }
    p.x+=(p.vx+Math.sin(p.ph)*12)*dt; p.y+=p.vy*dt;
    if(p.y>vh+24){parts.splice(i,1);continue;}
    if(p.s===1){ ctx.strokeStyle='rgba(190,212,224,.5)';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-2,p.y+11);ctx.stroke(); }
    else if(p.s===0){ ctx.fillStyle='rgba(244,196,210,.85)';
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ph);
      ctx.beginPath();ctx.ellipse(0,0,p.r+1,p.r*.6,0,0,7);ctx.fill();ctx.restore(); }
    else if(p.s===2){ ctx.fillStyle='rgba(196,120,52,.85)';
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ph*1.4);
      ctx.beginPath();ctx.ellipse(0,0,p.r+1.4,p.r*.7,0,0,7);ctx.fill();ctx.restore(); }
    else { ctx.fillStyle='rgba(248,250,252,.9)';
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*.8,0,7);ctx.fill(); }
  }
  ctx.restore();
}

/* ---------- 昼夜 ---------- */
function dayPhase(){ return (elapsed%DAY_SECONDS)/DAY_SECONDS; }           // 0..1
function sunlight(){ const p=dayPhase(); return Math.max(0, Math.sin(p*Math.PI)); } // 0 夜 1 正午

/* ---------- 云影 ---------- */
const cloudBlobs=Array.from({length:7},(_,i)=>({x:Math.random()*2-1,y:Math.random()*2-1,r:.18+Math.random()*.2,v:.008+Math.random()*.01}));

/* ---------- 绘制单块 ---------- */
function drawTile(t,st,sun,now){
  const px=isoX(t.x,t.y), py=isoY(t.x,t.y);
  const hw=TILE_W/2, hh=TILE_H/2;
  const sway=Math.sin(now*1.3+t.x*1.7+t.y*.9)*2.2;
  let top;
  if(t.type==='water'){
    const w=pal('water',st), sh=Math.sin(now*2+t.x+t.y*2)*.5+.5;
    top=[w[0]+sh*22,w[1]+sh*22,w[2]+sh*18];
  } else if(t.type==='field'){
    top=pal('soil',st);
  } else {
    top= t.r>.5? pal('grass',st):pal('grassHi',st);
    const j=(t.r-.5)*22;                       // 每块草地的明度抖动,打破均匀感
    top=[top[0]+j,top[1]+j,top[2]+j*.7];
  }
  const depth = t.edge? 26 : 7;                 // 岛缘崖壁

  ctx.beginPath();
  ctx.moveTo(px,py-hh);ctx.lineTo(px+hw,py);ctx.lineTo(px,py+hh);ctx.lineTo(px-hw,py);ctx.closePath();
  ctx.fillStyle=rgb(top);ctx.fill();
  // 侧面(微立体/崖壁)
  const side = t.edge? [120,96,76] : top.map(c=>c*.72);
  ctx.fillStyle=rgb(side);
  ctx.beginPath();ctx.moveTo(px-hw,py);ctx.lineTo(px,py+hh);ctx.lineTo(px,py+hh+depth);ctx.lineTo(px-hw,py+depth);ctx.closePath();ctx.fill();
  ctx.fillStyle=rgb(side.map(c=>c*.78));
  ctx.beginPath();ctx.moveTo(px+hw,py);ctx.lineTo(px,py+hh);ctx.lineTo(px,py+hh+depth);ctx.lineTo(px+hw,py+depth);ctx.closePath();ctx.fill();

  if(t.type==='field'){ // 作物行,随季节生长
    const g=Math.min(1,(st%1)*1.6+.15), c=pal('crop',st);
    ctx.strokeStyle=rgb(c,.95); ctx.lineWidth=2;
    for(let k=-2;k<=2;k++){
      const ox=k*hw/3.2;
      const h=(4+g*9)*(0.75+((t.r*7+k)%1)*.5);
      ctx.beginPath();
      ctx.moveTo(px+ox, py+hh*.3-k*2);
      ctx.quadraticCurveTo(px+ox+sway*.6, py+hh*.3-k*2-h*.6, px+ox+sway, py+hh*.3-k*2-h);
      ctx.stroke();
    }
  }
  if(t.type==='tree'||t.type==='forest'){
    const c = (st<1&&t.r>.86)? pal('treeAlt',st) : pal('tree',st);
    const n=t.type==='forest'?2:1;
    for(let k=0;k<n;k++){
      const ox=(k-((n-1)/2))*16+((t.r*13)%1-.5)*10, oy=((t.r*17+k)%1-.5)*8;
      ctx.strokeStyle='rgba(92,70,52,.9)';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(px+ox,py+oy);ctx.lineTo(px+ox+sway*.4,py+oy-15);ctx.stroke();
      const rr=11+((t.r*31+k)%1)*6;
      // 冬季落叶乔木变细雪冠
      ctx.fillStyle=rgb(c,.96);
      ctx.beginPath();ctx.arc(px+ox+sway*.5,py+oy-21,rr,0,7);ctx.fill();
      ctx.fillStyle=rgb(c.map(x=>Math.min(255,x*1.18)),.9);
      ctx.beginPath();ctx.arc(px+ox+sway*.5-rr*.3,py+oy-21-rr*.3,rr*.55,0,7);ctx.fill();
    }
  }
  if(t.type==='windmill'){
    ctx.fillStyle='rgba(238,232,220,.97)';
    ctx.beginPath();ctx.moveTo(px-9,py+4);ctx.lineTo(px+9,py+4);ctx.lineTo(px+5,py-34);ctx.lineTo(px-5,py-34);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(150,108,70,1)';
    ctx.beginPath();ctx.moveTo(px-10,py-32);ctx.lineTo(px+10,py-32);ctx.lineTo(px,py-44);ctx.closePath();ctx.fill();
    ctx.save();ctx.translate(px,py-36);ctx.rotate(now*1.1);
    ctx.strokeStyle='rgba(244,240,230,.95)';ctx.lineWidth=3;
    for(let k=0;k<4;k++){ctx.rotate(Math.PI/2);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-22);ctx.stroke();}
    ctx.restore();
  }
  if(t.type==='home'){
    ctx.fillStyle='rgba(226,216,198,.97)';
    ctx.fillRect(px-13,py-18,26,20);
    ctx.fillStyle='rgba(158,84,58,1)';
    ctx.beginPath();ctx.moveTo(px-16,py-18);ctx.lineTo(px+16,py-18);ctx.lineTo(px,py-32);ctx.closePath();ctx.fill();
    if(sun<.45){ctx.fillStyle=`rgba(255,214,130,${(0.45-sun)*2})`;ctx.fillRect(px-5,py-12,8,8);} // 夜里亮灯
    // 炊烟
    ctx.fillStyle='rgba(240,240,240,.28)';
    for(let k=0;k<3;k++){const yy=py-36-k*9-((now*8)%9);
      ctx.beginPath();ctx.arc(px+8+Math.sin(now+k)*3,yy,3+k*1.4,0,7);ctx.fill();}
  }
}

/* ---------- 帧 ---------- */
let last=performance.now(), hoverTile=null, selected=null, timeScale=1;
addEventListener('keydown',e=>{
  if(e.key==='f'||e.key==='F') timeScale = timeScale===1? 10:1;
  const k=parseInt(e.key);
  if(k>=1&&k<=4) elapsed=((k-1)*SEASON_DAYS+0.42)*DAY_SECONDS;
});
function frame(now){
  const t=now/1000, dt=Math.min(.05,Math.max(0,(now-last)/1000)); last=now;
  elapsed+=dt*timeScale;
  const dayF=elapsed/DAY_SECONDS, day=Math.floor(dayF);
  const st=(dayF/SEASON_DAYS)%4;            // 季节连续值
  const sun=sunlight();

  ctx.setTransform(dpr,0,0,dpr,0,0);
  // ---- 天空 ----
  const s1=pal('sky1',st), s2=pal('sky2',st);
  const nightMix=1-sun;
  const mixN=(c)=>[lerp(c[0],24,nightMix*.82),lerp(c[1],30,nightMix*.8),lerp(c[2],52,nightMix*.72)];
  const g=ctx.createLinearGradient(0,0,0,vh);
  g.addColorStop(0,rgb(mixN(s1)));g.addColorStop(1,rgb(mixN(s2)));
  ctx.fillStyle=g;ctx.fillRect(0,0,vw,vh);
  // 太阳/月亮
  const p=dayPhase(), ax=vw*(.15+.7*p), ay=vh*.42-Math.sin(p*Math.PI)*vh*.3;
  const glow=ctx.createRadialGradient(ax,ay,0,ax,ay,sun>0.02?180:90);
  if(sun>0.02){glow.addColorStop(0,'rgba(255,236,190,.9)');glow.addColorStop(1,'rgba(255,236,190,0)');}
  else{glow.addColorStop(0,'rgba(214,226,244,.8)');glow.addColorStop(1,'rgba(214,226,244,0)');}
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(ax,ay,sun>0.02?180:90,0,7);ctx.fill();

  // ---- 等距世界 ----
  cam.scale+= (cam.target-cam.scale)*Math.min(1,dt*1.6);
  cam.y    += (cam.ty-cam.y)*Math.min(1,dt*1.6);
  ctx.save();
  ctx.translate(vw/2, vh/2+cam.y- (N*TILE_H)/2 + 40);
  ctx.scale(cam.scale,cam.scale);
  for(const tile of map) drawTile(tile,st,sun,t);
  // 悬停高亮
  if(hoverTile){const px=isoX(hoverTile.x,hoverTile.y),py=isoY(hoverTile.x,hoverTile.y);
    ctx.strokeStyle='rgba(246,241,231,.9)';ctx.lineWidth=1.5;
    const pulse=1+Math.sin(t*5)*.04;
    ctx.beginPath();ctx.moveTo(px,py-TILE_H/2*pulse);ctx.lineTo(px+TILE_W/2*pulse,py);
    ctx.lineTo(px,py+TILE_H/2*pulse);ctx.lineTo(px-TILE_W/2*pulse,py);ctx.closePath();ctx.stroke();}
  ctx.restore();

  // ---- 云影(乘性暗斑缓慢漂移) ----
  ctx.save();ctx.globalCompositeOperation='multiply';
  for(const c of cloudBlobs){
    c.x+=c.v*dt*8; if(c.x>1.4)c.x=-1.4;
    const gx=vw*(c.x*.5+.5), gy=vh*(c.y*.5+.5), rr=c.r*vw;
    const cg=ctx.createRadialGradient(gx,gy,0,gx,gy,rr);
    cg.addColorStop(0,'rgba(225,228,232,.88)');cg.addColorStop(1,'rgba(255,255,255,1)');
    ctx.fillStyle=cg;ctx.fillRect(gx-rr,gy-rr,rr*2,rr*2);
  }
  ctx.restore();

  // ---- 昼夜整体色调 ----
  if(nightMix>0.02){
    ctx.fillStyle=`rgba(16,24,52,${nightMix*.42})`;ctx.fillRect(0,0,vw,vh);
  }
  const golden=Math.max(0,Math.sin(p*Math.PI*2))* (p<.5?0:1); // 暮金
  if(p>0.34&&p<0.5){ctx.fillStyle=`rgba(232,150,70,${(p-0.34)*0.9})`;
    ctx.globalCompositeOperation='soft-light';ctx.fillRect(0,0,vw,vh);ctx.globalCompositeOperation='source-over';}

  // ---- 粒子 ----
  spawnParticles(st,dt); drawParticles(dt,st);

  // ---- 轻晕影 ----
  const vg=ctx.createRadialGradient(vw/2,vh/2,vh*.42,vw/2,vh/2,vh*.95);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(8,10,14,.4)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,vw,vh);

  updateHUD(st,day,sun);
  springTick(dt);
  requestAnimationFrame(frame);
}

/* ---------- HUD ---------- */
const dialRing=document.getElementById('dialRing');
(function(){ // 四段细弧
  const NS='http://www.w3.org/2000/svg';
  for(let i=0;i<4;i++){const a0=i*90-90+4, a1=(i+1)*90-90-4;
    const r=50, c=54, rad=x=>x*Math.PI/180;
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d',`M ${c+r*Math.cos(rad(a0))} ${c+r*Math.sin(rad(a0))} A ${r} ${r} 0 0 1 ${c+r*Math.cos(rad(a1))} ${c+r*Math.sin(rad(a1))}`);
    p.setAttribute('fill','none');p.setAttribute('stroke','rgba(246,241,231,.5)');p.setAttribute('stroke-width','1');
    p.id='arc'+i; dialRing.appendChild(p);
  }
})();
const dot=document.getElementById('dialDot');
const seasonName=document.getElementById('seasonName'),seasonLatin=document.getElementById('seasonLatin');
const dayNum=document.getElementById('dayNum'), weatherTag=document.getElementById('weatherTag');
const weatherTexts=[['细雨润物','花瓣随风','溪水初涨'],['烈日当空','麦浪翻金','夜萤点点'],['西风渐紧','落叶铺金','果实低垂'],['初雪无声','炉火可亲','大地休眠']];
let lastDay=-1,lastSI=-1;
function updateHUD(st,day,sun){
  const si=Math.floor(st)%4;
  const ang=st/4*360;
  dot.setAttribute('cx',54+50*Math.cos((ang-90)*Math.PI/180));
  dot.setAttribute('cy',54+50*Math.sin((ang-90)*Math.PI/180));
  for(let i=0;i<4;i++)document.getElementById('arc'+i).setAttribute('stroke',i===si?'#c9a24b':'rgba(246,241,231,.35)');
  if(si!==lastSI){lastSI=si;seasonName.textContent=seasons[si].name;seasonLatin.textContent=seasons[si].latin;
    weatherTag.textContent='— '+weatherTexts[si][(Math.random()*3)|0]+' —';}
  if(day!==lastDay){lastDay=day;dayNum.textContent=String(day%28+1).padStart(2,'0');
    if(day%3===0)weatherTag.textContent='— '+weatherTexts[si][(Math.random()*3)|0]+' —';
    // 体力随新一天恢复
    leaves.forEach(l=>l.classList.remove('spent'));}
}
/* 体力叶 */
const stam=document.getElementById('stamina');const leaves=[];
for(let i=0;i<6;i++){const d=document.createElement('div');d.className='leaf';stam.appendChild(d);leaves.push(d);}

/* ---------- 弹簧物理面板 ---------- */
const panel=document.getElementById('panel');
const spring={x:110,v:0,target:110};
function springTick(dt){
  const k=170,damp=20;
  const a=-k*(spring.x-spring.target)-damp*spring.v;
  spring.v+=a*dt;spring.x+=spring.v*dt;
  panel.style.transform=`translateX(${spring.x}%)`;
}
function openPanel(tile){
  selected=tile;
  document.getElementById('tileName').textContent=names[tile.ni];
  document.getElementById('tileLatin').textContent=latins[tile.ni];
  spring.target=0;
  const set=(id,bid,val,delay)=>{
    const v=document.getElementById(id),b=document.getElementById(bid);
    b.style.transition='none';b.style.transform='scaleX(0)';
    let cur=0;const t0=performance.now();
    setTimeout(()=>{b.style.transition='transform 1.1s cubic-bezier(.2,.8,.2,1)';b.style.transform=`scaleX(${val/100})`;},delay);
    const roll=()=>{const e=(performance.now()-t0-delay)/900;
      if(e<0){requestAnimationFrame(roll);return;}
      cur=Math.min(1,e);v.textContent=Math.round(val*(1-Math.pow(1-cur,3)));
      if(cur<1)requestAnimationFrame(roll);};
    roll();
  };
  set('vFert','bFert',tile.fert,120);set('vMoist','bMoist',tile.moist,240);
  set('vPest','bPest',tile.pest,360);set('vMana','bMana',tile.mana,480);
  document.getElementById('whisper').style.opacity=0;
}
document.getElementById('panelClose').onclick=()=>{spring.target=110;};

/* ---------- 拾取 ---------- */
function pick(mx,my){
  const ox=vw/2, oy=vh/2+cam.y-(N*TILE_H)/2+40, s=cam.scale;
  const lx=(mx-ox)/s, ly=(my-oy)/s;
  const fx=(lx/(TILE_W/2)+ly/(TILE_H/2))/2, fy=(ly/(TILE_H/2)-lx/(TILE_W/2))/2;
  const x=Math.round(fx),y=Math.round(fy);
  return tileAt[x+','+y]||null;
}
W_hover: addEventListener('mousemove',e=>{
  hoverTile=entered?pick(e.clientX,e.clientY):null;
  document.body.style.cursor=hoverTile?'pointer':'default';
  // 卡牌 3D 倾斜
  const c=document.getElementById('cardPeek'),f=c.querySelector('.face'),r=c.getBoundingClientRect();
  if(e.clientX>r.left-40&&e.clientX<r.right+40&&e.clientY>r.top-40&&e.clientY<r.bottom+40){
    const dx=(e.clientX-(r.left+r.width/2))/r.width,dy=(e.clientY-(r.top+r.height/2))/r.height;
    f.style.transform=`rotateY(${dx*22}deg) rotateX(${-dy*22}deg)`;
  }else f.style.transform='';
});
addEventListener('click',e=>{
  if(!entered||e.target.id==='enter')return;
  if(panel.contains(e.target)||document.getElementById('cardPeek').contains(e.target))return;
  const t=pick(e.clientX,e.clientY);
  if(t){openPanel(t);
    // 消耗一片体力叶演示
    const free=leaves.find(l=>!l.classList.contains('spent'));if(free)free.classList.add('spent');
  }
});

/* ---------- 标题 → 大陆 无缝转场 ---------- */
let entered=false;
const cloudsCv=document.getElementById('clouds'),cctx=cloudsCv.getContext('2d');
function enterWorld(){
  if(entered)return;entered=true;
  const title=document.getElementById('title'),flash=document.getElementById('flash');
  // 1. KV 缓推近
  title.querySelector('.bg').style.transition='transform 2.4s cubic-bezier(.55,0,.3,1)';
  title.querySelector('.bg').style.transform='scale(1.22)';
  title.querySelector('.card').style.transition='opacity 1.1s, transform 1.4s cubic-bezier(.55,0,.3,1)';
  title.querySelector('.card').style.opacity=0;
  title.querySelector('.card').style.transform='translateY(-8vh) scale(.96)';
  // 2. 云幕扫过
  cloudsCv.width=vw*dpr;cloudsCv.height=vh*dpr;cloudsCv.style.width=vw+'px';cloudsCv.style.height=vh+'px';
  cloudsCv.style.opacity=1;
  const t0=performance.now(),blobs=Array.from({length:26},()=>({x:Math.random()*1.6-.3,y:Math.random(),r:.12+Math.random()*.22,v:1.1+Math.random()*.9}));
  (function sweep(){const e=(performance.now()-t0)/2400;
    cctx.setTransform(dpr,0,0,dpr,0,0);cctx.clearRect(0,0,vw,vh);
    for(const b of blobs){const x=vw*(b.x+ (e*b.v*1.8) -1.1), y=vh*b.y, r=b.r*vw*(1+e*.5);
      const gg=cctx.createRadialGradient(x,y,0,x,y,r);
      const a=Math.min(1,Math.min(e*3,(1.05-e)*2.6));
      gg.addColorStop(0,`rgba(250,248,242,${.95*a})`);gg.addColorStop(1,'rgba(250,248,242,0)');
      cctx.fillStyle=gg;cctx.beginPath();cctx.arc(x,y,r,0,7);cctx.fill();}
    if(e<1.05)requestAnimationFrame(sweep);else cloudsCv.style.opacity=0;})();
  // 3. 标题淡出 → 镜头从高空降落
  setTimeout(()=>{title.style.opacity=0;title.style.pointerEvents='none';
    cam.scale=1.85;cam.target=1;cam.y=-160;cam.ty=0;
    document.body.classList.add('hud-on');},900);
  setTimeout(()=>{title.remove();
    const w=document.getElementById('whisper');w.style.opacity=1;
    setTimeout(()=>{if(!selected)w.style.opacity=0;},9000);},3200);
}
document.getElementById('enter').onclick=enterWorld;

requestAnimationFrame(frame);
</script>
